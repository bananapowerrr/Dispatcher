# AgentBus providers.yaml — финальный стек (2026-09)
# Приоритет: Ollama 100 > SiliconFlow 80 > OpenRouter 60 > Together 40 > HuggingFace 30

- id: ollama
  type: ollama
  base_url: http://127.0.0.1:11434
  base_url_env: AGENTBUS_PROVIDER_OLLAMA_BASE_URL
  billing: local
  priority: 100
  enabled: true
  enabled_env: AGENTBUS_PROVIDER_OLLAMA_ENABLED
  dynamic: false
  capabilities: [coding, tools, streaming]
  models:
    - qwen2.5-coder:7b
    - qwen2.5-coder:14b
    - llama3.2:3b
    - qwen2.5:1.5b-instruct


- id: lmstudio
  type: openai_compatible
  base_url: http://127.0.0.1:1234/v1
  base_url_env: AGENTBUS_PROVIDER_LMSTUDIO_BASE_URL
  api_key_env: LMSTUDIO_API_KEY
  billing: local
  priority: 95
  enabled: true
  enabled_env: AGENTBUS_PROVIDER_LMSTUDIO_ENABLED
  dynamic: true
  capabilities: [coding, tools, streaming]
  models:
    - local-model

- id: siliconflow
  type: openai_compatible
  base_url: https://api.siliconflow.cn/v1
  base_url_env: AGENTBUS_PROVIDER_SILICONFLOW_BASE_URL
  api_key_env: SILICONFLOW_API
  billing: free
  priority: 80
  enabled: true
  enabled_env: AGENTBUS_PROVIDER_SILICONFLOW_ENABLED
  dynamic: true
  capabilities: [coding, tools, streaming]
  models:
    - deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    - THUDM/GLM-4-9B-0414
    - THUDM/GLM-Z1-9B-0414
    - Qwen/Qwen2-7B-Instruct
    - internlm/internlm2_5-7b-chat

- id: openrouter
  type: openai_compatible
  base_url: https://openrouter.ai/api/v1
  base_url_env: AGENTBUS_PROVIDER_OPENROUTER_BASE_URL
  api_key_env: OPENROUTER_API
  billing: free
  priority: 60
  enabled: true
  enabled_env: AGENTBUS_PROVIDER_OPENROUTER_ENABLED
  dynamic: true
  capabilities: [coding, tools, streaming]
  models:
    - openrouter/free
    - qwen/qwen3-coder:free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - minimax/minimax-m3:free
    - poolside/laguna-s.2.1:free
    - openai/gpt-oss-120b:free
    - meta-llama/llama-3.3-70b-instruct:free

- id: together
  type: openai_compatible
  base_url: https://api.together.xyz/v1
  base_url_env: AGENTBUS_PROVIDER_TOGETHER_BASE_URL
  api_key_env: TOGETHER_API
  billing: free
  priority: 40
  enabled: true
  enabled_env: AGENTBUS_PROVIDER_TOGETHER_ENABLED
  dynamic: true
  capabilities: [coding, tools, streaming]
  models:
    - meta-llama/Llama-3.3-70B-Instruct-Turbo
    - Qwen/Qwen2.5-Coder-32B-Instruct
    - deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    - meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo

- id: huggingface
  type: openai_compatible
  base_url: https://router.huggingface.co/v1
  base_url_env: AGENTBUS_PROVIDER_HUGGINGFACE_BASE_URL
  api_key_env: HUGGINGFACE_API
  billing: free
  priority: 30
  enabled: true
  enabled_env: AGENTBUS_PROVIDER_HUGGINGFACE_ENABLED
  dynamic: true
  capabilities: [coding, tools, streaming]
  models:
    - meta-llama/Llama-3.3-70B-Instruct
    - Qwen/Qwen2.5-72B-Instruct
    - meta-llama/Meta-Llama-3.1-8B-Instruct
    - google/gemma-2-9b-it
