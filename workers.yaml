# Реестр воркеров AgentBus v2.
# Воркер = (harness + provider + model) датакласс. Диспетчер выбирает лучшего
# доступного по score (health.py) и сложности задачи (router.py).
#
# Токены в command подставляет Executor:
#   {aider}, {opencode}, {ollama}, {aider_python}, {aider_model}, {message}
#   {yes} -> --yes (не-интерактивный режим), {files} -> --file <abs> по файлу.
#
# ВСЕ aider-воркеры получают целевые файлы ОДИНАКОВО: {files} в команде;
# provider/модель живут в yaml, а не в диспетчере.
#
# Провайдеры подключаются РЕГИСТРАЦИЕЙ, а не правкой диспетчера:
# раскомментируйте слот нужного облака и укажите ключ через переменную окружения
# (например AIDER_OPENAIC = sk-...), чтобы не хранить ключи в репозитории.

# ===== ЛОКАЛЬНЫЙ ОСНОВНОЙ ==============================================
- name: aider_local
  harness: aider
  provider: ollama
  model: ollama_chat/qwen2.5-coder:7b
  command: "{aider} {yes} --model {aider_model} --no-auto-commits --no-pretty --no-stream {files} --message {message}"
  priority: 10
  timeout: 900
  complexity: 2
  quality: 1.0
  enabled: true

# ===== СИЛЬНЫЕ ОБЛАКА (по умолчанию выключены, нет ключей) =============
# Aider автоматически подхватит ключ из переменной окружения.
- name: aider_groq
  harness: aider
  provider: groq
  model: groq/llama-3.3-70b-versatile
  command: "{aider} {yes} --model groq/llama-3.3-70b-versatile --no-auto-commits --no-pretty --no-stream {files} --message {message}"
  priority: 60
  timeout: 180
  complexity: 5
  quality: 1.4
  enabled: false

